name: make-video
on:
  workflow_dispatch:
    inputs:
      url:
        description: "기사 링크 (비워두면 자동으로 기사를 고릅니다)"
        required: false
        default: ""
      photos:
        description: "내 사진 (자동 입력용, 직접 쓰지 않아도 돼요)"
        required: false
        default: ""
  schedule:
    - cron: "0 2,6,11 * * *"   # 매일 한국시간 11:00, 15:00, 20:00
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 폰트와 ffmpeg 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum ffmpeg
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 뉴스 고르고 대본 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTICLE_URL: ${{ github.event.inputs.url }}
          PHOTO_IDS: ${{ github.event.inputs.photos }}
        run: python make_scenes.py
      - name: 영상 만들고 승인 요청 보내기
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHOTO_IDS: ${{ github.event.inputs.photos }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python make_video.py
      - name: 사용한 기사 기록 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used.json
          git diff --staged --quiet || (git commit -m "update used.json" && git pull --rebase --autostash && git push)
