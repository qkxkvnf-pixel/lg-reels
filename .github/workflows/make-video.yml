name: make-video
on:
  workflow_dispatch:
    inputs:
      url:
        description: "기사 링크 (비워두면 자동으로 기사를 고릅니다)"
        required: false
        default: ""
      photos:
        description: "내 사진 (자동 입력용, 직접 쓰지 않아도 돼요)"
        required: false
        default: ""
  schedule:
    - cron: "0 2,6,11 * * *"   # 매일 한국시간 11:00, 15:00, 20:00
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 폰트와 ffmpeg 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum ffmpeg
      - name: 부드러운 한글 폰트 내려받기 (실패해도 기본 폰트로 계속 진행)
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/BlackHanSans-Regular.ttf https://github.com/google/fonts/raw/main/ofl/blackhansans/BlackHanSans-Regular.ttf || echo "제목 폰트 받기 실패"
          curl -fsSL -o fonts/Jua-Regular.ttf https://github.com/google/fonts/raw/main/ofl/jua/Jua-Regular.ttf || echo "본문 폰트 받기 실패"
          ls -la fonts
      - name: 패키지 설치
        run: pip install --upgrade -r requirements.txt
      - name: 뉴스 고르고 대본 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTICLE_URL: ${{ github.event.inputs.url }}
          PHOTO_IDS: ${{ github.event.inputs.photos }}
        run: python make_scenes.py
      - name: 영상 만들고 승인 요청 보내기
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PHOTO_IDS: ${{ github.event.inputs.photos }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_IMAGES: "1"   # 1 = AI 그림 사용, 0 = 끄기(무료 사진만)
          CHANNEL_NAME: "가전 NEWS"   # 영상 왼쪽 위에 나오는 채널 이름 (내 계정 이름으로 바꿔도 돼요)
          AI_STYLE_NAME: "flat"   # 그림 스타일: flat(플랫 일러스트) / watercolor(수채화) / cartoon(카툰) / 3d
          AI_GEMINI: "0"   # Gemini 그림은 무료 한도가 없어서 꺼 둠 (유료로 켤 때만 1)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python make_video.py
      - name: 사용한 기사 기록 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used.json
          git diff --staged --quiet || (git commit -m "update used.json" && git pull --rebase --autostash && git push)
      - name: 실패하면 텔레그램으로 알려주기
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ 영상 제작에 실패했어요. 자세한 내용: ${RUN_URL}" > /dev/null
